server:
  port: 8080

spring:
  application:
    name: kotonoha-backend
  datasource:
    # 로컬 개발용 기본값(docker-compose.yml의 DB와 일치). 실제 환경에서는 환경변수로 덮어쓴다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kotonoha}
    username: ${DB_USER:kotonoha}
    password: ${DB_PASSWORD:kotonoha}
  threads:
    virtual:
      enabled: true

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:}
  base-url: https://generativelanguage.googleapis.com

jwt:
  # HS256 서명 키(32바이트 이상). 비워두면 시작할 때마다 임의 키를 만들어 쓰므로 재시작하면 로그인이 풀린다(개발용).
  secret: ${JWT_SECRET:}
  expiration: 7d
