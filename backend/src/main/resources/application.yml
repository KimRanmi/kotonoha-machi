spring:
  config:
    # 로컬 개발 시 backend/.env에 적어둔 값을 환경변수처럼 읽어온다(새 라이브러리 없이
    # Spring Boot 표준 기능으로 처리). 파일이 없어도(운영 환경 등) 에러 없이 넘어간다.
    # 둘째 줄은 .claude/worktrees/<이름>/backend에서 실행할 때 메인 체크아웃의 backend/.env를 읽는
    # 경로다(.env는 git에 안 올라가 워크트리에 복사되지 않는다). 뒤에 오는 항목이 앞을 덮어쓰므로
    # 워크트리 자신의 .env가 있으면 그쪽이 우선한다.
    import:
      - 'optional:file:../../../../backend/.env[.properties]'
      - 'optional:file:.env[.properties]'
  application:
    name: kotonoha-machi
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kotonoha_machi}
    username: ${DB_USERNAME:kotonoha_machi}
    password: ${DB_PASSWORD:kotonoha_machi}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  # 소셜 로그인(구글/카카오/네이버) 등록 정보는 여기 YAML이 아니라 OAuth2Config.java에서 코드로 등록한다.
  # Spring Boot가 YAML로 등록된 모든 제공자의 client-id를 부팅 시점에 필수로 검증하기 때문에, 하나라도
  # 비어 있으면(아직 발급 전이면) 애플리케이션 전체가 부팅에 실패한다 — 코드로 등록하면 비어 있는 제공자를
  # 그냥 건너뛸 수 있다.

# 헬스체크: /actuator/health(DB 연결 상태 포함) 하나만 외부에 연다. 나머지 엔드포인트는 만들지도 않고,
# 상태 요약("UP"/"DOWN")만 보여 주며 DB 종류·디스크 용량 같은 세부 정보는 숨긴다.
management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
  health:
    # 메일 서버·디스크 등은 외부 서비스 사정이라 우리 서버 상태 판단에서 뺀다(DB 상태만 본다).
    defaults:
      enabled: false
    db:
      enabled: true
server:
  port: ${SERVER_PORT:8080}
  # 리버스 프록시(Caddy) 뒤에서는 framework로 바꿔 X-Forwarded-* 헤더를 따른다(운영 compose가 설정).
  # 프록시 없이 직접 받는 로컬 개발에서는 헤더를 위조할 수 있으니 기본은 none.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      cookie:
        http-only: true
        # 로컬 HTTP 개발 환경에서 직접 테스트할 때만 false로 바꾼다. 운영 환경은 항상 HTTPS라
        # 기본값 true를 그대로 쓴다.
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

app:
  # 세션 쿠키를 주고받는 프런트엔드 오리진. CORS 허용 대상으로 쓴다.
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  email:
    resend-api-key: ${RESEND_API_KEY:}
    # 도메인 인증 전까지는 Resend 공용 테스트 도메인(본인 계정 이메일로만 발송 가능)을 쓴다.
    from-address: ${EMAIL_FROM_ADDRESS:onboarding@resend.dev}
  tts:
    # Google Cloud Text-to-Speech API 키. 비어 있으면 음성 합성을 쓸 수 없다(503) — 프런트엔드는 브라우저
    # 기본 음성으로 대신한다.
    google-api-key: ${GOOGLE_TTS_API_KEY:}
    # 합성에 쓸 일본어 음성. 바꾸면 이미 저장해 둔 음성은 쓰이지 않고 새로 합성한다.
    voice: ${GOOGLE_TTS_VOICE:ja-JP-Neural2-B}
    # 주민 성별별 음성. 여성은 B, 남성은 C가 기본이다.
    voice-female: ${GOOGLE_TTS_VOICE_FEMALE:ja-JP-Neural2-B}
    voice-male: ${GOOGLE_TTS_VOICE_MALE:ja-JP-Neural2-C}
  gemini:
    # Gemini API 키. 비어 있으면 주민과의 대화를 쓸 수 없다(503).
    api-key: ${GEMINI_API_KEY:}
    # 주민 대화에 쓸 Gemini 모델.
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
