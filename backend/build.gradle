plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'checkstyle'
	id 'com.diffplug.spotless' version '8.10.4'
}

group = 'com.kotonohamachi'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')

	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'com.resend:resend-java:4.28.0'
	runtimeOnly 'org.postgresql:postgresql'

	// spring-boot-dependencies가 참조하는 testcontainers-bom은 Gradle의 platform import로
	// 자동으로 펼쳐지지 않아(중첩 BOM), Spring Boot 4.1.1이 관리하는 버전(2.0.5)을 직접 임포트한다.
	testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

checkstyle {
	toolVersion = '13.4.2'
	configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
}

spotless {
	java {
		palantirJavaFormat('2.102.0').style('GOOGLE').formatJavadoc(false)
		target 'src/*/java/**/*.java'
	}
	groovyGradle {
		target '*.gradle'
		greclipse()
	}
}
