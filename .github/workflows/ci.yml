# master에 머지(푸시)될 때만 CLAUDE.md의 검증 명령어를 자동으로 돌린다. PR 커밋마다는 돌리지 않으므로 PR 전에 로컬에서 검증한다.
# 백엔드(테스트는 Testcontainers라 runner의 Docker를 쓴다)와 프런트는 서로 독립이라 병렬로 실행한다.
name: CI

on:
  push:
    branches: [master]

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (spotless + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Spotless 포맷 검사와 테스트
        run: ./gradlew spotlessCheck test

  frontend:
    name: frontend (prettier + lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm run build
